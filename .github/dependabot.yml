# 依存の更新 PR を毎週作る。CI（デプロイ）は master への push で動くので、PR はマージ前に中身を確認すること
version: 2
updates:
  - package-ecosystem: bundler   # Jekyll と gem（Gemfile.lock）
    directory: /
    schedule:
      interval: weekly
    groups:
      gems:
        patterns: ["*"]

  - package-ecosystem: pip       # 開催予定の取り込み（requirements.txt）
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: npm       # デプロイ用の wrangler（package-lock.json）
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
